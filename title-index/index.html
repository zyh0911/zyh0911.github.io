<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title Index · EDA / Arch / Circuits 2024–2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=553fc823">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-name">Title Index</span>
    <span class="brand-sub">Paper-title search across top EDA · Architecture · Circuits venues, 2024–2026</span>
  </div>
  <form id="search-form" class="search" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="e.g. placement reinforcement   |   &quot;logic synthesis&quot; -fpga   |   cxl OR hbm" aria-label="Keywords">
    <button type="submit">Search</button>
  </form>
  <div class="opts">
    <label><input type="checkbox" id="prefix" checked> Prefix match (llm also hits llms)</label>
    <label><input type="checkbox" id="authors"> Also search authors</label>
    <span class="syntax">Syntax: space = AND · <code>"exact phrase"</code> · <code>-exclude</code> · <code>A OR B</code></span>
  </div>
</header>

<main class="layout">
  <aside class="rail" aria-label="Filters">
    <section class="facet" data-facet="domain"><h2>Domain</h2><ul></ul></section>
    <section class="facet" data-facet="year"><h2>Year</h2><ul></ul></section>
    <section class="facet" data-facet="venue"><h2>Venue</h2><ul></ul></section>
    <button id="clear" class="ghost" type="button">Clear all filters</button>
  </aside>

  <section class="results">
    <div class="summary">
      <div id="count" class="count">Loading index…</div>
      <div class="sort">
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="relevance">Relevance</option>
          <option value="year">Year (newest first)</option>
          <option value="title">Title A→Z</option>
        </select>
      </div>
    </div>
    <div id="trend" class="trend" hidden></div>
    <div id="error" class="error" hidden></div>
    <ol id="list" class="list"></ol>
    <nav id="pager" class="pager" aria-label="Pagination"></nav>
  </section>
</main>

<script>window.DATA_URL = "papers.json?v=e866b7f7";</script>
<script src="engine.js?v=54fcb427"></script>
<script src="app.js?v=a4529844"></script>
</body>
</html>
